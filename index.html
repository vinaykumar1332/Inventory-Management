<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1f3a" />
  <meta name="description"
    content="SiteSeal Inventory — multi-site waterproofing materials, batches, expiry, tools and bills. Client demo with mock data." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SiteSeal" />
  <meta name="application-name" content="SiteSeal Inventory" />
  <meta name="msapplication-TileColor" content="#0f1f3a" />
  <meta name="msapplication-config" content="/browserconfig.xml" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#0f1f3a" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
  <title>SiteSeal Inventory</title>
  <style>
    /* Launch screen: shown instantly from HTML, removed once the app shell mounts */
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #f5f7fa;
      transition: opacity 0.35s ease;
    }

    html.dark #boot-splash {
      background: #0b1220;
    }

    #boot-splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .boot-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      animation: boot-in 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .boot-name {
      font: 600 15px/1 Inter, system-ui, sans-serif;
      letter-spacing: 0.02em;
      color: #0f1f3a;
      animation: boot-in 0.5s 0.08s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    html.dark .boot-name {
      color: #e2e8f0;
    }

    .boot-bar {
      width: 120px;
      height: 3px;
      border-radius: 999px;
      background: rgba(15, 31, 58, 0.12);
      overflow: hidden;
    }

    .boot-bar span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: inherit;
      background: #0f1f3a;
      animation: boot-slide 1.1s ease-in-out infinite;
    }

    html.dark .boot-bar span {
      background: #e2e8f0;
    }

    @keyframes boot-in {
      from {
        opacity: 0;
        transform: translateY(6px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes boot-slide {
      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(260%);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .boot-logo,
      .boot-name,
      .boot-bar span {
        animation: none;
      }
    }

    /* Pre-paint background to avoid a white flash before the theme loads */
    html {
      background: #f5f7fa;
    }

    html.dark {
      background: #0b1220;
    }
  </style>
  <script>
    // Apply the saved theme before first paint (key matches app.json storagePrefix + "theme").
    try {
      var themeCookie = document.cookie.match(/(?:^|; )siteseal:theme=([^;]*)/)
      var mode = themeCookie ? JSON.parse(decodeURIComponent(themeCookie[1])) : 'system'
      var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
      if (dark) document.documentElement.classList.add('dark')
    } catch (e) { }
  </script>
</head>

<body>
  <div id="boot-splash" aria-hidden="true">
    <img class="boot-logo" src="/favicon.svg" width="72" height="72" alt="" />
    <span class="boot-name">SiteSeal</span>
    <span class="boot-bar"><span></span></span>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
